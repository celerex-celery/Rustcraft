[package]
name = "minexel"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "minexel"
path = "src/main.rs"

[dependencies]
macroquad = "0.4"
image = "0.24"
windows = { version = "0.59", features = ["Win32_Foundation", "Win32_System_ProcessStatus", "Win32_System_SystemInformation", "Win32_System", "Win32_System_Threading"] }

[profile.release]
opt-level = 3
